services:
  app:
    image: byoda04/leads-difusion:latest
    container_name: leads-difusion
    restart: unless-stopped
    ports:
      - '3011:3011'
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: '3011'
      HOSTNAME: 0.0.0.0
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3011/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
